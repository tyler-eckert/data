<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f6f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Data">
<title>Eckert Data</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>/* apply saved theme before paint */
try{var t=localStorage.getItem('data-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div class="top-shim" aria-hidden="true"></div>
<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="#fff"><rect x="4" y="11" width="3.4" height="8.5" rx="1.7"/><rect x="9.3" y="6" width="3.4" height="13.5" rx="1.7"/><rect x="14.6" y="13" width="3.4" height="6.5" rx="1.7"/></g><circle cx="18.3" cy="6.5" r="1.9" fill="#7fcf9f"/></svg></div>
      <div class="logo-word">eckert<span>.data</span></div>
    </div>
    <div class="nav-label">Track</div>
    <nav id="nav">
      <button class="nav-btn" data-page="entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Data entry</button>
      <button class="nav-btn" data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Overview</button>
    </nav>
    <div class="side-foot">
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Loading…</span></div>
      <button class="link-btn" id="signOut">Sign out</button>
      <div class="theme-toggle" id="themeToggle"><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div><h1 id="pageTitle">Data entry</h1><p id="pageSub"></p></div>
      <div class="top-actions" id="topActions"></div>
    </header>

    <!-- ============ DATA ENTRY ============ -->
    <section class="page" id="p-entry">
      <div class="grid g-12">
        <div class="card c-5 entry-card">
          <div class="card-h"><div><h3>New entry</h3><div class="sub">Timestamp fills in automatically</div></div></div>
          <form id="entryF" class="form" autocomplete="off">
            <div class="full">
              <label for="eMetric">Metric</label>
              <div class="with-btn">
                <select class="in" id="eMetric" required></select>
                <button type="button" class="btn" id="eNewMetric" title="Create a metric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
              </div>
            </div>
            <div class="full">
              <label for="eValue">Value</label>
              <div class="val-wrap"><input class="in num" id="eValue" type="number" step="any" inputmode="decimal" placeholder="0"><span class="unit" id="eUnit"></span></div>
            </div>
            <div class="full">
              <label for="eTs">Timestamp</label>
              <div class="with-btn">
                <input class="in" id="eTs" type="datetime-local" step="60" required>
                <button type="button" class="btn" id="eNow">Now</button>
              </div>
            </div>
            <div class="full">
              <label for="eNotes">Notes</label>
              <textarea class="in" id="eNotes" rows="2" placeholder="Optional"></textarea>
            </div>
          </form>
          <div class="form-actions">
            <button class="btn primary" form="entryF" type="submit" id="eSave">Save entry</button>
            <span class="muted" id="eHint"></span>
          </div>
        </div>

        <div class="card c-7">
          <div class="card-h">
            <div><h3>Metrics</h3><div class="sub">What you track. Click one to edit it.</div></div>
            <div class="right"><button class="btn sm" id="mNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New metric</button></div>
          </div>
          <div class="tbl-wrap"><table class="table" id="mTable"></table></div>
        </div>

        <div class="card c-12">
          <div class="card-h">
            <div><h3>Recent entries</h3><div class="sub" id="rCount"></div></div>
            <div class="right toolbar">
              <select class="in sel sm" id="rMetric"></select>
              <button class="btn sm" id="rExport" title="Download the filtered entries as CSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>CSV</button>
            </div>
          </div>
          <div class="tbl-wrap"><table class="table" id="rTable"></table></div>
          <div class="more" id="rMore"></div>
        </div>
      </div>
    </section>

    <!-- ============ OVERVIEW ============ -->
    <section class="page" id="p-overview">
      <div class="grid g-12" id="ovKpis"></div>
      <div style="height:18px" id="ovGap"></div>
      <div class="grid g-12" id="ovGrid"></div>
    </section>
  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-page="entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Entry</button>
  <button data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Overview</button>
  <button id="themeMob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>Theme</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<div class="boot" id="boot"><div class="boot-card">
  <div class="logo">
    <div class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="#fff"><rect x="4" y="11" width="3.4" height="8.5" rx="1.7"/><rect x="9.3" y="6" width="3.4" height="13.5" rx="1.7"/><rect x="14.6" y="13" width="3.4" height="6.5" rx="1.7"/></g><circle cx="18.3" cy="6.5" r="1.9" fill="#7fcf9f"/></svg></div>
    <div class="logo-word">eckert<span>.data</span></div>
  </div>
  <div id="bootBody"><p class="muted">Loading…</p></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>/* always fetch the newest code (GitHub Pages caches for 10 min) */
(function(){var t=Date.now(),q=['js/config.js','js/db.js','js/charts.js','js/app.js'];
 (function next(){var src=q.shift();if(!src)return;var s=document.createElement('script');s.src=src+'?_='+t;s.onload=next;document.body.appendChild(s);})();})();</script>
</body>
</html>
